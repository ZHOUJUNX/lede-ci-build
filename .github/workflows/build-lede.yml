name: Build LEDE OpenWrt Firmware

on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]

jobs:
  build:
    name: Compile Lede Firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Show workspace files
        run: ls -la

      - name: Clear git global insteadOf proxy config
        run: |
          git config --global --unset-all url."https://mirror.ghproxy.com/https://github.com".insteadOf || true

      - name: Run build script
        run: |
          export FORCE_UNSAFE_CONFIGURE=1
          ./lede_build.sh

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: lede-firmware-${{ github.run_number }}
          path: firmware/
          retention-days: 30
