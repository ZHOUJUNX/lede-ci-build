name: Build OpenWrt X86 Firmware
on:
  workflow_dispatch:
  schedule:
    - cron: '50 20 * * *'

jobs:
  build:
    name: Compile OpenWrt X86 Firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      - name: Show workspace files
        run: ls -la
      # 仅缓存dl源码包，减少重复下载（可跨任务复用缓存）
      - name: Cache dl source
        id: cache_dl
        uses: actions/cache@v4
        with:
          path: lede/dl
          key: Linux-lede-dl
          restore-keys: |
            Linux-lede-dl
      # 打印缓存命中状态
      - name: Print cache hit status
        run: echo "Cache hit = ${{ steps.cache_dl.outputs.cache-hit }}"
      # 执行编译脚本（内部包含深度磁盘清理）
      - name: Run build script
        run: |
          export FORCE_UNSAFE_CONFIGURE=1
          chmod +x ./lede_build.sh
          ./lede_build.sh
      # 清理完成后查看磁盘空间
      - name: Show disk space after cleanup
        run: df -h
      # 获取日期，用于artifact命名
      - name: Get build date
        run: echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      # 把固件zip复制到当前目录，避免嵌套bin文件夹
      - name: Copy firmware to workspace root
        run: cp firmware/*.zip ./ || true

      # 上传固件，if-no-files-found: ignore 没有固件也不报错
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt_x86_${{ env.BUILD_DATE }}
          path: ./*.zip
          retention-days: 30
          if-no-files-found: ignore
